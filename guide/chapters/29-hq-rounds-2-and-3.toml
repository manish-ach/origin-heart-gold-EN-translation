closes = ["q-0266"]
evidence = "guide/10 q-0298 (round 3; the order makes the Miltank sick: file 31 @4654-@4666 ClearFlag 744 (Miltank healthy), set again by the Dream World cure, file 898 @2329; emulator, CN and EN: Miltank healthy and the farmer only greets until the order). The Dream World and the romance partner choice: guide/09 romance route entry. Closes q-0266: the love reading (and the romance route) must be done before this step; the fortune-teller stops offering it once you have fought Will and Karen in the Dream World (guide/09 q-0266 step 1)."

